<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kitchen Kompanian</title>
  <link rel="stylesheet" href="index.css" />
</head>

<body>
  <div class="device">
    <nav>
      <button data-tab="Inventory" class="active">
        <img src="icons/kitchen.png" alt="Kitchen Icon">
        <span>Inventory</span>
      </button>

    <button data-tab="shopping">
      <img src="icons/shopping.png" alt="Shopping Icon">
      <span>Shopping</span>
    </button>

      <button data-tab="recipes">
        <img src="icons/recipe-book.png" alt="Recipe Book Icon">
        <span>Recipes</span>
      </button>

      <button data-tab="profile">
        <img src="icons/pfp.png" alt="">
        <span>Profile</span>
      </button>
    </nav>

    <main>
      <!-- TAB 1 -->
      <section id="Inventory" class="tab active">
        <button class="add-item" id="addItemBtn">＋</button>
        <button class="back-btn" id="backBtn">←</button>
        <div id="toast" class="toast"></div>

        <div class="screen" id="mainScreen">
          <div class="category fridge" data-cat="Fridge">Fridge</div>
          <div class="category freezer" data-cat="Freezer">Freezer</div>
          <div class="category pantry" data-cat="Pantry">Pantry</div>
          <div class="category expiring" data-cat="Expiring Soon">Expiring Soon</div>
          <div class="category expired" data-cat="Expired">Expired</div>
        </div>

        <div class="items-view" id="itemsView">
          <div class="items-header">
            <h2 id="categoryTitle"></h2>
          </div>
          <div class="cards" id="cardsContainer"></div>
        </div>

        <div class="modal" id="itemModal">
          <div class="modal-content">
            <h3 id="modalTitle">Add Item</h3>
            <input type="text" id="itemName" placeholder="Item name" />
            <input type="date" id="itemDate" />
            <select id="itemCategory">
              <option>Fridge</option>
              <option>Freezer</option>
              <option>Pantry</option>
            </select>
            <input type="number" id="itemQty" min="1" value="1" />
            <button id="saveItemBtn">Save</button>
          </div>
        </div>
        <!--<h1 class="main-header">Welcome back to Kitchen Kompanion!</h1>
        <div class="container">

          <div class="list" id="fridge-list">
            <h2>Current Fridge Items</h2>
            <input type="text" id="searchFridge" placeholder="Search foods..." />
            <div class="table-container">
              <table id="foodTable">
                <thead>
                  <tr>
                    <th>Item</th>
                    <th>Expires</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>

          <div class="list" id="expiring-list">
            <h2>Expiring Soon</h2>
            <div class="table-container">
              <table id="expiringTable">
                <thead>
                  <tr>
                    <th>Item</th>
                    <th>Expires</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>-->
      </section>


      <!-- TAB 2 -->
      <section id="shopping" class="tab">
        <div style="display:flex;gap:8px;max-width:520px;">
          <input id="newItem" placeholder="Add a new item..."
            style="flex:1;background: white ;color:#e5e7eb;border:1px solid #334155;border-radius:10px;padding:10px;" />
          <button id="addItem"
            style="background:#22c55e;border:0;color:#0a0f1d;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer;">
            Add
          </button>
        </div>

        <ul id="shoppingList" style="list-style:none;padding:0;margin:14px 0 6px;display:grid;gap:8px;"></ul>
        <p style="color:#94a3b8;font-size:12px;margin:0;">
          Tip: click a task to cross it off; use the × button to delete it.
        </p>
      </section>

      <!-- TAB 3 -->
      <section id="recipes" class="tab">
        <h2 class="recipes-header">Recipes</h2>
        <div class="recipes-grid">
          <div><input type="button" id="seafood" value="Seafood" /></div>
          <div><input type="button" id="soups" value="Soups" /></div>
          <div><input type="button" id="salads" value="Salads" /></div>
          <div><input type="button" id="meat" value="Meats" /></div>
          <div><input type="button" id="sauces" value="Sauces" /></div>
          <div><input type="button" id="desserts" value="Desserts" /></div>
          <div><input type="button" id="eggs" value="Eggs" /></div>
          <div><input type="button" id="beverages" value="Beverages" /></div>
          <div><input type="button" id="bread" value="Bread" /></div>
          <div><input type="button" id="pasta" value="Pasta" /></div>
          <div><input type="button" id="dairy" value="Dairy" /></div>
          <div><input type="button" id="pizza" value="Pizza" /></div>
        </div>
      </section>


      <!-- TAB 4 -->
      <section id="profile" class="tab" style="text-align:center; margin-top: 70px;">
        <img src="icons/pfp.png" alt="Profile picture"
            style="width:160px;border-radius:50%;cursor:pointer;" id="profileImg">
        <h2 style="font-size:28px;font-weight:800;margin:12px 0 6px;">User 1</h2>

        <button id="editBtn" class="btn-primary" aria-haspopup="dialog" aria-controls="editModal">
          Edit
        </button>

        <div class="profile-grid">
          <div class="field">
            <div class="label">Email</div>
            <div id="emailValue" class="value"></div>
          </div>

          <div class="field">
            <div class="label">Favorite Recipes</div>
            <div id="favoriteRecipesValue" class="value"></div>
          </div>

          <div class="field">
            <div class="label">Dislikes</div>
            <div id="dislikesValue" class="value"></div>
          </div>

          <div class="field">
            <div class="label">Dietary Restrictions</div>
            <div id="dietaryRestrictionsValue" class="value"></div>
          </div>

          <div class="field">
            <div class="label">Allergies</div>
            <div id="allergiesValue" class="value"></div>
          </div>
        </div>
      </section>

      <div id="editModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
        <div class="modal-card">
          <div class="modal-header">
            <h3 id="modalTitle">Edit Profile</h3>
            <button class="icon-btn" id="closeModalBtn" aria-label="Close">✕</button>
          </div>

          <div class="modal-body">
            <div class="modal-field">
              <label class="modal-label" for="emailInput">Email</label>
              <input id="emailInput" type="email" class="input" placeholder="name@example.com" />
            </div>

            <div class="modal-field">
              <div class="modal-label-row">
                <label class="modal-label">Favorite Recipes</label>
                <button class="btn-secondary" data-add="favoriteRecipes">+ Add</button>
              </div>
              <div id="favoriteRecipesList" class="list"></div>
            </div>

            <div class="modal-field">
              <div class="modal-label-row">
                <label class="modal-label">Dislikes</label>
                <button class="btn-secondary" data-add="dislikes">+ Add</button>
              </div>
              <div id="dislikesList" class="list"></div>
            </div>

            <div class="modal-field">
              <div class="modal-label-row">
                <label class="modal-label">Dietary Restrictions</label>
                <button class="btn-secondary" data-add="dietaryRestrictions">+ Add</button>
              </div>
              <div id="dietaryRestrictionsList" class="list"></div>
            </div>

            <div class="modal-field">
              <div class="modal-label-row">
                <label class="modal-label">Allergies</label>
                <button class="btn-secondary" data-add="allergies">+ Add</button>
              </div>
              <div id="allergiesList" class="list"></div>
            </div>
          </div>

          <div class="modal-footer">
            <button id="saveBtn" class="btn-primary">Save</button>
            <button id="cancelBtn" class="btn-ghost">Cancel</button>
          </div>
        </div>
      </div>

  <script src="main.js"></script>
</body>

</html>
